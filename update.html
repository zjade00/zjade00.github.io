<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0878f9">
  <title>更新客户管理</title>
  <style>body{font:16px/1.6 system-ui,sans-serif;margin:0;padding:48px 24px;color:#101828;background:#f5f7fa}main{max-width:420px;margin:auto}button,a{font:inherit;display:inline-block;padding:12px 18px;background:#0878f9;color:white;border:0;border-radius:10px;text-decoration:none}button:disabled{opacity:.6}p{color:#526174}</style>
</head>
<body><main><h1>更新客户管理</h1><p>刷新页面程序，保留这台设备里已录入的车账号和客户数据。</p><button id="update">更新并打开</button><p id="status" role="status"></p></main>
<script>
document.getElementById('update').addEventListener('click', async () => {
  const button = document.getElementById('update');
  const status = document.getElementById('status');
  button.disabled = true;
  status.textContent = '正在检查新版…';
  const version = '20260920-customer-date-defaults-r1';
  const destination = '/?v=' + version + '&t=' + Date.now();
  try {
    const response = await fetch(destination, { cache: 'no-store' });
    if (!response.ok) throw new Error('network');
    const html = await response.text();
    if (!html.includes('content="' + version + '"')) throw new Error('pending');
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.filter(r => r.scope === location.origin + '/').map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.filter(key => key.startsWith('customer-manager-')).map(key => caches.delete(key)));
    }
    status.textContent = '新版已就绪，正在打开…';
    // Preserve an email login/recovery fragment while replacing the app shell.
    // This page never clears localStorage, so old phone records remain intact.
    location.replace(destination + location.hash);
  } catch (error) {
    status.textContent = error.message === 'pending' ? '新版还在同步，请稍后再点一次更新。现有数据保留。' : '暂时连接不上，请检查网络后重试。现有数据保留。';
    button.disabled = false;
  }
});
</script></body></html>
